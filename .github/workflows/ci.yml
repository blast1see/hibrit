name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where this is developed and where the drive-letter working
        # directories live; Linux is where anything quietly assuming a Windows
        # path convention shows up.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The `tools` tier drives the real binaries against material it
      # synthesises: dovi_tool writes an RPU from a JSON config with no video
      # involved, and ffmpeg builds a ten-second HDR10 clip in a fifth of a
      # second. That is cheap enough for a runner, and without it every line
      # that shells out would be covered on one developer's machine only.
      #
      # Installed on both platforms rather than Linux alone, because Windows is
      # where this is actually used and where a path with a space in it goes
      # wrong. Versions are pinned so a run that passes today passes tomorrow;
      # this is the part nobody notices has stopped working.
      - name: dovi_tool and hdr10plus_tool (Linux)
        if: runner.os == 'Linux'
        env:
          DOVI_TOOL_VERSION: "2.3.3"
          HDR10PLUS_TOOL_VERSION: "1.7.2"
        run: |
          mkdir -p tools
          base=https://github.com/quietvoid
          curl -fsSL "$base/dovi_tool/releases/download/${DOVI_TOOL_VERSION}/dovi_tool-${DOVI_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C tools
          curl -fsSL "$base/hdr10plus_tool/releases/download/${HDR10PLUS_TOOL_VERSION}/hdr10plus_tool-${HDR10PLUS_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C tools
          chmod +x tools/dovi_tool tools/hdr10plus_tool

      - name: ffmpeg, mkvtoolnix and mediainfo (Linux)
        if: runner.os == 'Linux'
        # Through the runner's own package manager: the synthetic clip needs
        # libx265 with 10-bit support, which the distribution build has.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix mediainfo

      - name: dovi_tool and hdr10plus_tool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOVI_TOOL_VERSION: "2.3.3"
          HDR10PLUS_TOOL_VERSION: "1.7.2"
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $base = "https://github.com/quietvoid"
          $jobs = @(
            "$base/dovi_tool/releases/download/$env:DOVI_TOOL_VERSION/dovi_tool-$env:DOVI_TOOL_VERSION-x86_64-pc-windows-msvc.zip",
            "$base/hdr10plus_tool/releases/download/$env:HDR10PLUS_TOOL_VERSION/hdr10plus_tool-$env:HDR10PLUS_TOOL_VERSION-x86_64-pc-windows-msvc.zip"
          )
          foreach ($url in $jobs) {
            $zip = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($url))
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath tools -Force
          }
          Get-ChildItem tools

      - name: ffmpeg, mkvtoolnix and mediainfo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # ffmpeg-full, not ffmpeg: the synthetic clip needs libx265 with 10-bit
        # support, which the essentials build leaves out.
        run: |
          choco install ffmpeg-full mkvtoolnix mediainfo-cli -y --no-progress
          # The mkvtoolnix package shims the GUI and leaves mkvmerge and
          # mkvextract in the install directory, so PATH needs the directory
          # itself. Chocolatey's own shim directory is already on PATH and does
          # not contain them.
          $dir = "C:\Program Files\MKVToolNix"
          if (-not (Test-Path "$dir\mkvmerge.exe")) {
            throw "mkvmerge is not in $dir; the package layout changed"
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: pip install -e ".[dev]"

      - name: What this runner can do
        run: python -m hibrit doctor

      # The `real` tier stays out: it needs tens of gigabytes of films. It runs
      # on the developer's machine, and the README says so rather than letting a
      # green tick imply it ran.
      #
      # Hence the slightly lower coverage bar than the project's own 80% gate
      # (see pyproject.toml): the paths only real media reaches — profile 7
      # conversion, alignment against an actual second encode — are unreachable
      # here by construction. Measured for this tier: 78%.
      - name: Tests
        run: pytest -q -m "not real" --cov=hibrit --cov-fail-under=72

      - name: The package answers for itself
        run: python -m hibrit --version

  package:
    # Proving the release artefact builds on every push, rather than at tag time
    # when it is too late to find out.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[build]"
      - run: pyinstaller --noconfirm hibrit.spec

      # A frozen build can start and still be broken: a missing hidden import
      # only shows up on the code path that needs it, and `--version` needs
      # none of them. So the packaged executable is made to do the actual job.
      - name: The tools it will drive
        shell: pwsh
        env:
          DOVI_TOOL_VERSION: "2.3.3"
          HDR10PLUS_TOOL_VERSION: "1.7.2"
        run: |
          New-Item -ItemType Directory -Force dist/hibrit/tools | Out-Null
          $base = "https://github.com/quietvoid"
          $urls = @(
            "$base/dovi_tool/releases/download/$env:DOVI_TOOL_VERSION/dovi_tool-$env:DOVI_TOOL_VERSION-x86_64-pc-windows-msvc.zip",
            "$base/hdr10plus_tool/releases/download/$env:HDR10PLUS_TOOL_VERSION/hdr10plus_tool-$env:HDR10PLUS_TOOL_VERSION-x86_64-pc-windows-msvc.zip"
          )
          foreach ($url in $urls) {
            $zip = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($url))
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath dist/hibrit/tools -Force
          }
          choco install ffmpeg-full mkvtoolnix mediainfo-cli -y --no-progress
          "C:\Program Files\MKVToolNix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The binary answers for itself
        run: |
          dist/hibrit/hibrit.exe --version
          dist/hibrit/hibrit.exe doctor

      - name: The binary does the job
        shell: pwsh
        # Ten seconds of synthesised HDR10, a generated RPU, and a whole run
        # through the packaged executable — plan, inject, remux, verify. If any
        # of that is missing from the bundle this fails here rather than in
        # somebody's download.
        run: |
          $work = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force $work | Out-Null
          ffmpeg -y -hide_banner -loglevel error -f lavfi `
            -i "testsrc2=size=320x240:rate=24:duration=10" `
            -c:v libx265 -pix_fmt yuv420p10le -preset ultrafast -crf 30 `
            -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc `
            -x265-params "log-level=none:master-display=G(8500,39850)B(6550,2300)R(35400,14600)WP(15635,16450)L(10000000,1)" `
            -f hevc "$work/clip.hevc"
          @'
          {"length": 240, "source_min_pq": 0, "source_max_pq": 3079,
           "level6": {"max_display_mastering_luminance": 1000,
                      "min_display_mastering_luminance": 1,
                      "max_content_light_level": 1000,
                      "max_frame_average_light_level": 400}}
          '@ | Set-Content -Encoding utf8 "$work/gen.json"
          dist/hibrit/tools/dovi_tool.exe generate -j "$work/gen.json" -o "$work/rpu.bin"
          dist/hibrit/tools/dovi_tool.exe inject-rpu -i "$work/clip.hevc" --rpu-in "$work/rpu.bin" -o "$work/dv.hevc"
          mkvmerge -q -o "$work/source.mkv" "$work/dv.hevc"
          mkvmerge -q -o "$work/target.mkv" "$work/clip.hevc"

          dist/hibrit/hibrit.exe plan "$work/source.mkv" "$work/target.mkv"
          dist/hibrit/hibrit.exe run "$work/source.mkv" "$work/target.mkv" `
            -o "$work/out.mkv" -w "$work/run" -y
          if (-not (Test-Path "$work/out.mkv")) { throw "the packaged build wrote nothing" }

      - name: Take the borrowed binaries back out
        # They were downloaded to prove the package works, not to ship inside
        # it. A release does not bundle them and neither should this artifact,
        # or somebody downloads a stale dovi_tool without knowing they have.
        shell: pwsh
        run: Remove-Item -Recurse -Force dist/hibrit/tools

      - uses: actions/upload-artifact@v4
        with:
          name: hibrit-windows
          path: dist/hibrit
          retention-days: 14
