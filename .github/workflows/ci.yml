name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where this is developed and where the drive-letter working
        # directories live; Linux is where anything quietly assuming a Windows
        # path convention shows up.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The `tools` tier drives the real binaries against material it
      # synthesises: dovi_tool writes an RPU from a JSON config with no video
      # involved, and ffmpeg builds a ten-second HDR10 clip in a fifth of a
      # second. That is cheap enough for a runner, and without it every line
      # that shells out would be covered on one developer's machine only.
      #
      # Installed from the projects' own releases rather than a packaging
      # action, pinned so a run that passes today passes tomorrow. This is the
      # part nobody notices has stopped working.
      - name: dovi_tool and hdr10plus_tool (Linux)
        if: runner.os == 'Linux'
        env:
          DOVI_TOOL_VERSION: "2.3.3"
          HDR10PLUS_TOOL_VERSION: "1.7.2"
        run: |
          mkdir -p tools
          base=https://github.com/quietvoid
          curl -fsSL "$base/dovi_tool/releases/download/${DOVI_TOOL_VERSION}/dovi_tool-${DOVI_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C tools
          curl -fsSL "$base/hdr10plus_tool/releases/download/${HDR10PLUS_TOOL_VERSION}/hdr10plus_tool-${HDR10PLUS_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C tools
          chmod +x tools/dovi_tool tools/hdr10plus_tool

      - name: ffmpeg, mkvtoolnix and mediainfo (Linux)
        if: runner.os == 'Linux'
        # Through the runner's own package manager: the synthetic clip needs
        # libx265 with 10-bit support, which the distribution build has.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix mediainfo

      - run: pip install -e ".[dev]"

      - name: What this runner can do
        run: python -m hibrit doctor
        # Windows installs nothing, so doctor reports what is missing and the
        # tools tier skips itself. That is the intended outcome, not a failure.
        continue-on-error: true

      # The `real` tier stays out: it needs tens of gigabytes of films. It runs
      # on the developer's machine, and the README says so rather than letting a
      # green tick imply it ran.
      #
      # Hence the slightly lower coverage bar than the project's own 80% gate
      # (see pyproject.toml): the paths only real media reaches — profile 7
      # conversion, alignment against an actual second encode — are unreachable
      # here by construction. Measured for this tier: 78%.
      - name: Tests
        run: pytest -q -m "not real" --cov=hibrit --cov-fail-under=72

      - name: The package answers for itself
        run: python -m hibrit --version

  package:
    # Proving the release artefact builds on every push, rather than at tag time
    # when it is too late to find out.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[build]"
      - run: pyinstaller --noconfirm hibrit.spec
      - name: The binary answers for itself
        run: dist/hibrit/hibrit.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: hibrit-windows
          path: dist/hibrit
          retention-days: 14
