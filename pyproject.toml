[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hibrit"
version = "0.1.4"
description = "Transfer Dolby Vision and HDR10+ metadata between releases of the same title"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "blast1see" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.11",
]
build = ["pyinstaller>=6.12"]
# Only `hibrit plot` needs this, and bundling it would roughly double the
# packaged build for a command most people never run.
plot = ["matplotlib>=3.8"]

[project.scripts]
hibrit = "hibrit.__main__:main"

[project.gui-scripts]
hibrit-gui = "hibrit.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["hibrit"]

[tool.pytest.ini_options]
minversion = "8.3"
# The window tests are out of the default run: they open a real Tk window, and
# a machine without a display would report them as failures rather than as
# something it could not attempt. `pytest -m gui` asks for them explicitly.
addopts = "-ra --strict-markers -m 'not gui'"
testpaths = ["tests"]
markers = [
    "tools: requires dovi_tool / hdr10plus_tool / ffmpeg binaries",
    "real: requires large real-world media files; slow",
    "gui: requires a graphical display",
]

[tool.coverage.run]
branch = true
relative_files = true
omit = [
    # The window needs a display and a person. It is exercised by hand against
    # real files before a release; counting it here would either force a pile of
    # widget assertions that prove nothing, or drag the number down far enough
    # that the gate stops meaning anything.
    "hibrit/gui.py",
]

[tool.coverage.report]
# This is the gate for the *whole* suite, which is what runs on a machine with
# the binaries and the media. CI can only run the first tier and passes its own,
# lower --cov-fail-under; see .github/workflows/ci.yml for why.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.$',
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["hibrit"]
